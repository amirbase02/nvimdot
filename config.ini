
;  ┌──────────────────────────────────────────────────────────────────────────┐
;  │  polybar  ·  "darcula aurora"                                            │
;  │  bar `main`  ·  eDP-1 1920x1080 @98dpi  ·  i3  ·  polybar 3.7.x          │
;  │  font: JetBrainsMono Nerd Font   ·  launch: ~/.config/polybar/launch.sh  │
;  ├──────────────────────────────────────────────────────────────────────────┤
;  │  Layout                                                                  │
;  │    left    workspaces             (flush against the left edge)          │
;  │    center  clock + age            (one continuous pill)                  │
;  │    right   cpu mem temp gpu │ disk net │ light vol │ battery  + tray      │
;  ├──────────────────────────────────────────────────────────────────────────┤
;  │  TWO RULES THIS CONFIG LIVES BY                                          │
;  │                                                                          │
;  │  1. polybar only resolves ${...} when it is the WHOLE value, so the       │
;  │     inline %{F#...} tags below must use literal hex. Re-theme = swap      │
;  │     these:                                                               │
;  │        bar bg  #F21E1F22  (95% opaque, needs pseudo-transparency)         │
;  │        solid   #1E1F22    surface #2B2D30    line    #464A52             │
;  │        fg      #C8CBD0    fg-dim  #9AA0AA    muted   #5C6169             │
;  │        orange  #E0913F    yellow  #E3C07B    green   #8BC077             │
;  │        teal    #4FC3A1    blue    #62AEEF    purple  #C09AD4             │
;  │        pink    #E6899E    red     #E5646F                                │
;  │                                                                          │
;  │  2. Every icon keeps its trailing space INSIDE the font run:              │
;  │        %{T2}󰻠 %{T-}        not   %{T2}󰻠%{T-}                             │
;  │     polybar sizes each block by that run's advance width, so a wide       │
;  │     Nerd glyph with no padding inside the run gets its right edge         │
;  │     painted over by whatever comes next. This is the clipping fix.        │
;  │                                                                          │
;  │  PILL CAPS — %{T3} is font-2, an oversized cap-only slot so the           │
;  │  half-circles fill the bar height:  %{B-}%{F#2B2D30}%{T3}%{T-}%{F-}     │
;  └──────────────────────────────────────────────────────────────────────────┘

[colors]
background     = #F21E1F22
background-alt = #2B2D30
foreground     = #C8CBD0
foreground-alt = #9AA0AA
disabled       = #5C6169
line           = #464A52
primary        = #E0913F
secondary      = #8BC077
alert          = #E5646F
yellow         = #E3C07B
teal           = #4FC3A1
blue           = #62AEEF
purple         = #C09AD4
pink           = #E6899E

;═══════════════════════════════════════════════════════════════════════════════
;  BAR
;═══════════════════════════════════════════════════════════════════════════════

[bar/main]
; Floating card, inset from the screen edges to sit with i3's gaps.
monitor        =
monitor-strict = false
bottom         = false
fixed-center   = true

width          = 100%:-16pt
height         = 20pt
offset-x       = 8pt
offset-y       = 5pt
radius         = 8

background     = ${colors.background}
foreground     = ${colors.foreground}

border-size    = 0
line-size      = 2pt

; Spacing is handled per-module (pills) — no global margins or separators.
padding        = 0
module-margin  = 0
separator      =

; T1 text · T2 icons · T3 pill caps · T4 spare · T5 emoji
; font-2 is only ever used for the  caps: size ≈ bar_height_px / 1.7 so the
; half-circles slightly overflow the bar instead of leaving a seam.
font-0 = "JetBrainsMono Nerd Font:style=SemiBold:size=8.5;2"
font-1 = "JetBrainsMono Nerd Font:style=Regular:size=10;2"
font-2 = "JetBrainsMono Nerd Font:style=Regular:size=16;4"
font-3 = "JetBrainsMono Nerd Font:style=Bold:size=7.5;2"
font-4 = "Noto Color Emoji:scale=8;2"

; No leading padding on the left block, so workspace 1 sits flush against the
; left edge of the bar.
modules-left   = i3
modules-center = date age
modules-right  = cpu memory temperature gpu fs eth wlan backlight pulseaudio battery capslock tray

cursor-click   = pointer
cursor-scroll  = pointer
enable-ipc     = true
wm-restack     = i3

[settings]
screenchange-reload = true
pseudo-transparency = true

;═══════════════════════════════════════════════════════════════════════════════
;  LEFT  ·  workspaces
;═══════════════════════════════════════════════════════════════════════════════

[module/i3]
type = internal/i3
pin-workspaces  = true
show-urgent     = true
strip-wsnumbers = true
index-sort      = true
enable-click    = true
enable-scroll   = true
wrapping-scroll = false
fuzzy-match     = true

format = <label-state><label-mode>

; Focused workspace is a filled orange pill; the rest stay quiet and narrow.
label-focused = "%{B-}%{F#E0913F}%{T3}%{T-}%{F-}%{B#E0913F}%{F#1E1F22} %index% %{B-}%{F#E0913F}%{T3}%{T-}%{F-} "
label-focused-padding = 0

label-visible = "%{B-}%{F#2B2D30}%{T3}%{T-}%{F-}%{B#2B2D30}%{F#C8CBD0} %index% %{B-}%{F#2B2D30}%{T3}%{T-}%{F-} "
label-visible-padding = 0

label-unfocused = "%{F#5C6169}%index%%{F-}"
label-unfocused-padding = 1

label-urgent = "%{B-}%{F#E5646F}%{T3}%{T-}%{F-}%{B#E5646F}%{F#1E1F22} %index% %{B-}%{F#E5646F}%{T3}%{T-}%{F-} "
label-urgent-padding = 0

label-mode = "%{B#E5646F}%{F#1E1F22} %mode% %{B-}%{F-}"
label-mode-padding = 1

;═══════════════════════════════════════════════════════════════════════════════
;  CENTER  ·  clock + age — two modules that share one pill
;═══════════════════════════════════════════════════════════════════════════════

[module/date]
type = internal/date
interval = 1

date     = %a %d %b
time     = %H:%M
; click to swap in the full date / seconds
date-alt = %Y-%m-%d
time-alt = %H:%M:%S

format = <label>
format-prefix = "%{B-}%{F#2B2D30}%{T3}%{T-}%{F-}"
label = "%{B#2B2D30} %{F#62AEEF}%{T2}󰸗 %{T-}%{F#9AA0AA}%date% %{F#4FC3A1}%{T2}󱑒 %{T-}%{F#C8CBD0}%time% %{B-}"

[module/age]
type = custom/script
exec = ~/.config/polybar/age.py
interval = 1800

format = <label>
format-suffix = "%{B-}%{F#2B2D30}%{T3}%{T-}%{F-}"
label = "%{B#2B2D30}%{F#464A52}│%{F-} %{F#E6899E}%{T2}󰃱 %{T-}%{F#9AA0AA}%output% %{B-}"

;═══════════════════════════════════════════════════════════════════════════════
;  RIGHT  ·  system panel.  Every module paints #2B2D30 behind itself, so with
;            module-margin = 0 the whole group reads as one seamless pill:
;            `cpu` opens it with the left cap, `battery` closes it.
;═══════════════════════════════════════════════════════════════════════════════

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = "%{B-}%{F#2B2D30}%{T3}%{T-}%{F-}"
label = "%{B#2B2D30} %{F#62AEEF}%{T2}󰻠 %{T-}%{F#C8CBD0}%percentage:2%% %{B-}"

[module/memory]
;  󰍛 58% [ 4.1 GiB ]  — the badge sits on the absolute figure, and its weight
;  tracks the load: at low usage it is barely a shade off the pill, and it
;  lifts through teal → amber → red as it fills. Five steps, at 25/50/75/90%.
;
;    <25   bg #2E3033  text #7A8189  rule #34413E   (almost invisible)
;    <50   bg #31343A  text #9AA0AA  rule #3D6A5F
;    <75   bg #34373E  text #B4BAC3  rule #45907C
;    <90   bg #4A3A2C  text #F0DCC0  rule #E0913F
;    >=90  bg #5A2E33  text #FFDDE1  rule #E5646F   (full brightness)
;
;  A script rather than internal/memory because <ramp-used> can only be placed
;  outside <label>, and the badge has to open around a token inside it.
;  Used = MemTotal - MemAvailable, i.e. the same figure %gb_used% reports.
type = custom/script
interval = 2
exec = awk '/^MemTotal:/{t=$2} /^MemAvailable:/{a=$2} END{u=t-a; p=int(u*100/t+0.5); if(p>=90){bg="#5A2E33";fg="#FFDDE1";ln="#E5646F";ic="#E5646F"}else if(p>=75){bg="#4A3A2C";fg="#F0DCC0";ln="#E0913F";ic="#E0913F"}else if(p>=50){bg="#34373E";fg="#B4BAC3";ln="#45907C";ic="#4FC3A1"}else if(p>=25){bg="#31343A";fg="#9AA0AA";ln="#3D6A5F";ic="#46A88C"}else{bg="#2E3033";fg="#7A8189";ln="#34413E";ic="#3F8F7B"} print "%{F" ic "}%{T2}󰍛 %{T-}%{F#C8CBD0}" p "% %{B" bg "}%{u" ln "}%{o" ln "}%{+u}%{+o}%{F" fg "} " sprintf("%.1f", u/1048576) " GiB %{-u}%{-o}%{B#2B2D30}"}' /proc/meminfo
format = <label>
label = "%{B#2B2D30}%output% %{B-}"

[module/temperature]
; thermal_zone9 = x86_pkg_temp (CPU package). If a kernel update shuffles the
; zones, re-check with:
;   for z in /sys/class/thermal/thermal_zone*; do echo "$z $(cat $z/type)"; done
type = internal/temperature
thermal-zone     = 9
base-temperature = 40
warn-temperature = 85
interval = 5

format      = "%{B#2B2D30}<ramp>%{F#C8CBD0}<label> %{B-}"
format-warn = "%{B#2B2D30}<ramp>%{F#E5646F}<label-warn> %{B-}"
label       = %temperature-c%
label-warn  = %temperature-c%

ramp-0 = "%{T2}󰔏 %{T-}"
ramp-1 = "%{T2}󰔏 %{T-}"
ramp-2 = "%{T2}󰔏 %{T-}"
ramp-3 = "%{T2}󰔏 %{T-}"
ramp-0-foreground = ${colors.secondary}
ramp-1-foreground = ${colors.yellow}
ramp-2-foreground = ${colors.primary}
ramp-3-foreground = ${colors.alert}

[module/gpu]
; RTD3-safe: reads the dGPU's PCI runtime power state from sysfs first and only
; wakes nvidia-smi when the card is already active.  󰢮 49°C 46% [ 1889M ]
; Icon colour = thermals; badge weight = VRAM pressure, same five steps as
; [module/memory].
type = custom/script
interval = 7
exec = st=$(cat /sys/bus/pci/devices/0000:01:00.0/power/runtime_status 2>/dev/null); if [ "$st" != active ]; then echo "%{F#5C6169}%{T2}󰢮 %{T-}off"; exit 0; fi; r=$(nvidia-smi --query-gpu=temperature.gpu,memory.used,memory.total --format=csv,noheader,nounits 2>/dev/null | head -n1 | tr -d ' ' | tr ',' ' '); if [ -z "$r" ]; then echo "%{F#5C6169}%{T2}󰢮 %{T-}n/a"; exit 0; fi; set -- $r; p=$(( $2 * 100 / $3 )); if [ "$1" -ge 80 ]; then c="#E5646F"; else c="#8BC077"; fi; if [ "$p" -ge 90 ]; then bg="#5A2E33"; fg="#FFDDE1"; ln="#E5646F"; elif [ "$p" -ge 75 ]; then bg="#4A3A2C"; fg="#F0DCC0"; ln="#E0913F"; elif [ "$p" -ge 50 ]; then bg="#34373E"; fg="#B4BAC3"; ln="#6A9A58"; elif [ "$p" -ge 25 ]; then bg="#31343A"; fg="#9AA0AA"; ln="#47693F"; else bg="#2E3033"; fg="#7A8189"; ln="#35443A"; fi; echo "%{F$c}%{T2}󰢮 %{T-}%{F#C8CBD0}$1°C $p% %{B$bg}%{u$ln}%{o$ln}%{+u}%{+o}%{F$fg} $2M %{-u}%{-o}%{B#2B2D30}"
format = <label>
label = "%{B#2B2D30}%output%%{F-} %{B-}"

[module/fs]
type = internal/fs
mount-0  = /
interval = 30
format-mounted  = <label-mounted>
label-mounted   = "%{B#2B2D30}%{F#464A52}│%{F-} %{F#C09AD4}%{T2}󰋊 %{T-}%{F#C8CBD0}%free% %{B-}"
label-unmounted =

[module/eth]
; Hidden entirely while the cable is out.
type = internal/network
interface-type = wired
interface = enp7s0
interval  = 3
format-connected    = <label-connected>
label-connected     = "%{B#2B2D30}%{F#464A52}│%{F-} %{F#8BC077}%{T2}󰈀 %{T-}%{F#C8CBD0}%downspeed:7% %{B-}"
format-disconnected =

[module/wlan]
; ESSID capped at 8 chars so a long network name can't push the right block
; into the centred clock — with fixed-center = true the right block has to stay
; under ~800px, and it measures ~730px with the GPU awake.
type = internal/network
interface-type = wireless
interface = wlp8s0
interval  = 3

format-connected = "%{B#2B2D30}%{F#464A52}│%{F-} <ramp-signal>%{F#C8CBD0}<label-connected> %{B-}"
label-connected  = "%{F#C8CBD0}%essid:0:8%%{F-} %{F#9AA0AA}%signal:2%%%{F-}"

format-disconnected = "%{B#2B2D30}%{F#464A52}│%{F-} %{F#5C6169}%{T2}󰤮 %{T-}%{F#5C6169}off %{B-}"

ramp-signal-0 = "%{T2}󰤯 %{T-}"
ramp-signal-1 = "%{T2}󰤟 %{T-}"
ramp-signal-2 = "%{T2}󰤢 %{T-}"
ramp-signal-3 = "%{T2}󰤥 %{T-}"
ramp-signal-4 = "%{T2}󰤨 %{T-}"
ramp-signal-0-foreground = ${colors.alert}
ramp-signal-1-foreground = ${colors.primary}
ramp-signal-2-foreground = ${colors.yellow}
ramp-signal-3-foreground = ${colors.secondary}
ramp-signal-4-foreground = ${colors.secondary}

click-left = nm-connection-editor &

[module/backlight]
; Scroll to dim/brighten. Three things matter here:
;
;  * enable-scroll stays false. polybar's built-in scroll writes
;    /sys/class/backlight/nvidia_wmi_ec_backlight/brightness directly, and that
;    node is root:video 0664 with no ACL while you are not in the `video` group
;    — the write just fails. brightnessctl is setuid root, so it always works.
;  * the scroll is wired with inline %{A4}/%{A5} action tags *inside* the
;    format, not only with the module-level scroll-up/scroll-down keys. Action
;    tags are handled by the renderer, so they work in every module type.
;  * the step is given in raw units (+40 / 40-) rather than 5%+, so no `%`
;    ever has to survive polybar's tag parser. max_brightness is 800 here, so
;    40 units == exactly 5 percentage points.
type = internal/backlight
card = nvidia_wmi_ec_backlight
use-actual-brightness = true
enable-scroll = false

format = "%{B#2B2D30}%{F#464A52}│%{F-} %{A4:brightnessctl -d nvidia_wmi_ec_backlight set +40 -q:}%{A5:brightnessctl -d nvidia_wmi_ec_backlight set 40- -q:}<ramp>%{F#C8CBD0}<label>%{A}%{A} %{B-}"
label  = "%percentage:2%%"

ramp-0 = "%{T2}󰃞 %{T-}"
ramp-1 = "%{T2}󰃟 %{T-}"
ramp-2 = "%{T2}󰃠 %{T-}"
ramp-foreground = ${colors.yellow}

scroll-up   = brightnessctl -d nvidia_wmi_ec_backlight set +40 -q
scroll-down = brightnessctl -d nvidia_wmi_ec_backlight set 40- -q

[module/pulseaudio]
; `interval` here is NOT a poll rate — for internal/pulseaudio it is the scroll
; step in percent points. 5 = scroll moves the volume by 5.
; use-ui-max = false clamps polybar's own scrolling at 100%.
type = internal/pulseaudio
use-ui-max = false
interval = 5

format-volume = "%{B#2B2D30}<ramp-volume>%{F#C8CBD0}<label-volume> %{B-}"
label-volume  = "%percentage:2%%"

format-muted = "%{B#2B2D30}%{F#5C6169}%{T2}󰝟 %{T-}%{F#5C6169}mute %{B-}"

ramp-volume-0 = "%{T2}󰕿 %{T-}"
ramp-volume-1 = "%{T2}󰖀 %{T-}"
ramp-volume-2 = "%{T2}󰕾 %{T-}"
ramp-volume-foreground = ${colors.primary}

click-right  = pavucontrol &
click-middle = pactl set-sink-mute @DEFAULT_SINK@ toggle

[module/battery]
type = internal/battery
battery       = BAT1
adapter       = ACAD
full-at       = 99
low-at        = 15
poll-interval = 5

format-charging    = "%{B#2B2D30}%{F#464A52}│%{F-} <animation-charging>%{F#C8CBD0}<label-charging> %{B-}%{F#2B2D30}%{T3}%{T-}%{F-}"
format-discharging = "%{B#2B2D30}%{F#464A52}│%{F-} <ramp-capacity>%{F#C8CBD0}<label-discharging> %{B-}%{F#2B2D30}%{T3}%{T-}%{F-}"
format-full        = "%{B#2B2D30}%{F#464A52}│%{F-} %{F#8BC077}%{T2}󰁹 %{T-}%{F#C8CBD0}<label-full> %{B-}%{F#2B2D30}%{T3}%{T-}%{F-}"
format-low         = "%{B#2B2D30}%{F#464A52}│%{F-} <animation-low>%{F#E5646F}<label-low> %{B-}%{F#2B2D30}%{T3}%{T-}%{F-}"

label-charging    = "%percentage:2%%"
label-discharging = "%percentage:2%%"
label-full        = "%percentage:2%%"
label-low         = "%percentage:2%%"

ramp-capacity-0 = "%{T2}󰁺 %{T-}"
ramp-capacity-1 = "%{T2}󰁻 %{T-}"
ramp-capacity-2 = "%{T2}󰁼 %{T-}"
ramp-capacity-3 = "%{T2}󰁽 %{T-}"
ramp-capacity-4 = "%{T2}󰁾 %{T-}"
ramp-capacity-5 = "%{T2}󰁿 %{T-}"
ramp-capacity-6 = "%{T2}󰂀 %{T-}"
ramp-capacity-7 = "%{T2}󰂁 %{T-}"
ramp-capacity-8 = "%{T2}󰂂 %{T-}"
ramp-capacity-9 = "%{T2}󰁹 %{T-}"
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1-foreground = ${colors.alert}
ramp-capacity-2-foreground = ${colors.primary}
ramp-capacity-3-foreground = ${colors.primary}
ramp-capacity-4-foreground = ${colors.yellow}
ramp-capacity-5-foreground = ${colors.yellow}
ramp-capacity-6-foreground = ${colors.secondary}
ramp-capacity-7-foreground = ${colors.secondary}
ramp-capacity-8-foreground = ${colors.secondary}
ramp-capacity-9-foreground = ${colors.secondary}

animation-charging-0 = "%{T2}󰢜 %{T-}"
animation-charging-1 = "%{T2}󰂆 %{T-}"
animation-charging-2 = "%{T2}󰂇 %{T-}"
animation-charging-3 = "%{T2}󰂈 %{T-}"
animation-charging-4 = "%{T2}󰂉 %{T-}"
animation-charging-5 = "%{T2}󰂊 %{T-}"
animation-charging-6 = "%{T2}󰂋 %{T-}"
animation-charging-7 = "%{T2}󰂅 %{T-}"
animation-charging-foreground = ${colors.secondary}
animation-charging-framerate = 700

animation-low-0 = "%{T2}󰂃 %{T-}"
animation-low-1 = "%{T2}󰁺 %{T-}"
animation-low-foreground = ${colors.alert}
animation-low-framerate = 600

;═══════════════════════════════════════════════════════════════════════════════
;  RIGHT tail  ·  caps-lock warning + system tray
;═══════════════════════════════════════════════════════════════════════════════

[module/capslock]
; Only visible while caps lock is on — a red pill you cannot miss.
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-indicator>
label-layout =
label-indicator-on-capslock = "  %{B-}%{F#E5646F}%{T3}%{T-}%{F-}%{B#E5646F}%{F#1E1F22} %{T2}󰘲 %{T-}CAPS %{B-}%{F#E5646F}%{T3}%{T-}%{F-}"
label-indicator-on-capslock-padding = 0

[module/tray]
type = internal/tray
tray-spacing = 6pt
tray-padding = 4pt

